<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>大圣游戏 V4.1</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { width:100%; height:100%; overflow:hidden; background:#1a3a1a; overscroll-behavior:none; touch-action:none; -webkit-user-select:none; user-select:none; }
  body { position:fixed; inset:0; }
  canvas { display:block; width:100%; height:100%; touch-action:none; }
  #mobile-controls { position:fixed; inset:0; z-index:20; pointer-events:none; display:none; }
  #mobile-controls.mobile-on { display:block; }
  #mobile-joystick { position:absolute; left:max(16px, env(safe-area-inset-left)); bottom:max(18px, env(safe-area-inset-bottom)); width:132px; height:132px; border-radius:50%; background:rgba(10,20,25,.28); border:2px solid rgba(255,255,255,.28); pointer-events:auto; touch-action:none; }
  #mobile-stick { position:absolute; left:38px; top:38px; width:56px; height:56px; border-radius:50%; background:rgba(255,221,68,.72); border:2px solid rgba(255,255,255,.75); box-shadow:0 0 14px rgba(255,221,68,.28); transform:translate(0,0); }
  #mobile-skills { position:absolute; right:max(12px, env(safe-area-inset-right)); bottom:max(14px, env(safe-area-inset-bottom)); width:190px; height:170px; pointer-events:none; }
  .mobile-skill { position:absolute; width:58px; height:58px; border-radius:50%; border:2px solid rgba(255,255,255,.72); background:rgba(20,25,28,.70); color:#fff; font:bold 10px Arial,sans-serif; line-height:1.05; text-align:center; padding:5px 2px; pointer-events:auto; touch-action:none; box-shadow:0 2px 8px rgba(0,0,0,.35); }
  .mobile-skill.ready { border-color:#ffe066; box-shadow:0 0 10px rgba(255,224,102,.38); }
  .mobile-skill.cooldown { opacity:.58; }
  .mobile-skill span { display:block; font-size:14px; margin-bottom:2px; }
  .mobile-skill small { display:block; font-size:9px; font-weight:normal; }
  .mobile-skill[data-skill="0"] { right:64px; bottom:0; }
  .mobile-skill[data-skill="1"] { right:0; bottom:48px; }
  .mobile-skill[data-skill="2"] { right:65px; bottom:68px; }
  .mobile-skill[data-skill="3"] { right:128px; bottom:48px; }
  .mobile-skill[data-skill="4"] { right:64px; bottom:112px; }
  #mobile-pause { position:absolute; top:max(12px, env(safe-area-inset-top)); right:max(12px, env(safe-area-inset-right)); width:44px; height:44px; border-radius:14px; border:1px solid rgba(255,255,255,.5); background:rgba(0,0,0,.42); color:#fff; font:bold 18px Arial,sans-serif; pointer-events:auto; touch-action:none; }
  #mobile-wushuang { position:absolute; right:130px; bottom:112px; width:58px; height:58px; border-radius:50%; border:2px solid rgba(255,166,72,.55); background:radial-gradient(circle at 35% 25%,rgba(255,232,126,.18),rgba(76,24,8,.84) 62%,rgba(18,6,3,.94)); color:#e6a95e; font:900 11px Arial,sans-serif; pointer-events:auto; touch-action:none; box-shadow:0 4px 18px rgba(0,0,0,.42); }
  #mobile-wushuang.ready { color:#ffe66d; border-color:#ffd34e; box-shadow:0 0 22px rgba(255,187,58,.62),inset 0 0 14px rgba(255,223,90,.12); animation:wushuangPulse .75s ease-in-out infinite alternate; }
  #mobile-wushuang small { display:block; font-size:9px; margin-top:3px; }
  @keyframes wushuangPulse { from{transform:scale(1)} to{transform:scale(1.08)} }
  #orientation-tip { position:absolute; top:max(62px, calc(env(safe-area-inset-top) + 50px)); left:50%; transform:translateX(-50%); color:rgba(255,255,255,.7); font:12px Arial,sans-serif; background:rgba(0,0,0,.28); padding:5px 9px; border-radius:999px; white-space:nowrap; pointer-events:none; display:none; }
  @media (pointer:coarse), (max-width:900px) { #orientation-tip { display:block; } }
  @media (orientation:landscape) and (max-height:520px) { #orientation-tip { display:none; } #mobile-joystick { width:116px; height:116px; } #mobile-stick { left:33px; top:33px; width:50px; height:50px; } #mobile-skills { transform:scale(.92); transform-origin:bottom right; } }
  @media (max-width:430px) and (orientation:portrait) { #mobile-joystick { width:118px; height:118px; } #mobile-stick { left:34px; top:34px; width:50px; height:50px; } #mobile-skills { transform:scale(.88); transform-origin:bottom right; right:4px; } }

  #cinematic-ui { position:fixed; inset:0; z-index:18; pointer-events:none; overflow:hidden; }
  #cinematic-flash { position:absolute; inset:0; opacity:0; background:#fff; mix-blend-mode:screen; }
  #cinematic-vignette { position:absolute; inset:0; opacity:0; background:radial-gradient(circle at center, transparent 30%, rgba(0,0,0,.82) 100%); }
  #cinematic-banner { position:absolute; left:50%; top:18%; transform:translate(-50%,-50%) scale(.72); opacity:0; text-align:center; white-space:nowrap; }
  #cinematic-banner .line { width:min(64vw,560px); height:2px; margin:8px auto; background:linear-gradient(90deg,transparent,currentColor,transparent); box-shadow:0 0 14px currentColor; }
  #cinematic-title { color:#ffe066; font:900 clamp(26px,5vw,60px) Arial,sans-serif; letter-spacing:.18em; text-shadow:0 0 12px currentColor,0 4px 12px rgba(0,0,0,.8); }
  #cinematic-sub { color:#fff; font:700 clamp(12px,2vw,20px) Arial,sans-serif; letter-spacing:.22em; text-shadow:0 2px 8px rgba(0,0,0,.9); }
  #skill-stamp { position:absolute; left:50%; top:32%; transform:translate(-50%,-50%) scale(.55) rotate(-6deg); opacity:0; padding:4px 14px; color:#ffe066; border-left:4px solid currentColor; border-right:4px solid currentColor; font:900 clamp(16px,3vw,30px) Arial,sans-serif; letter-spacing:.12em; text-shadow:0 0 10px currentColor,0 3px 8px rgba(0,0,0,.8); white-space:nowrap; }

  /* V4.0 视觉系统 */
  #mobile-joystick { backdrop-filter:blur(8px); box-shadow:inset 0 0 24px rgba(255,255,255,.04),0 10px 30px rgba(0,0,0,.28); border-color:rgba(255,230,140,.34); }
  #mobile-stick { background:radial-gradient(circle at 35% 30%,#fff4ba,#e5b92e 55%,#88600b); box-shadow:0 0 22px rgba(255,218,82,.42),inset 0 0 8px rgba(255,255,255,.45); }
  .mobile-skill { backdrop-filter:blur(10px); background:radial-gradient(circle at 35% 25%,rgba(255,255,255,.16),rgba(15,18,24,.78) 58%,rgba(4,7,12,.88)); border-color:rgba(255,255,255,.42); box-shadow:0 5px 18px rgba(0,0,0,.42),inset 0 0 12px rgba(255,255,255,.05); transition:opacity .12s ease,border-color .12s ease,box-shadow .12s ease; }
  .mobile-skill[data-skill="0"] { --skill:#ffd166; }
  .mobile-skill[data-skill="1"] { --skill:#ffcf5a; }
  .mobile-skill[data-skill="2"] { --skill:#ff9f1c; }
  .mobile-skill[data-skill="3"] { --skill:#8bd3ff; }
  .mobile-skill[data-skill="4"] { --skill:#7cfc9a; }
  .mobile-skill.ready { border-color:var(--skill,#ffe066); box-shadow:0 0 16px color-mix(in srgb,var(--skill,#ffe066) 42%,transparent),0 5px 18px rgba(0,0,0,.42),inset 0 0 12px rgba(255,255,255,.08); }
  .mobile-skill span { color:var(--skill,#fff); text-shadow:0 0 8px color-mix(in srgb,var(--skill,#fff) 55%,transparent); }
  #mobile-pause { backdrop-filter:blur(8px); background:rgba(8,12,18,.56); border-color:rgba(255,225,140,.46); box-shadow:0 5px 18px rgba(0,0,0,.32); }
  #orientation-tip { backdrop-filter:blur(8px); border:1px solid rgba(255,255,255,.12); }
  #err {
    position:fixed; top:0; left:0; right:0; z-index:999;
    background:#400; color:#f44; padding:12px; font:14px monospace;
    display:none; white-space:pre-wrap; word-break:break-all;
  }
</style>
</head>
<body>
<div id="err"></div>
<canvas id="game"></canvas>
<div id="mobile-controls" aria-hidden="true">
  <div id="orientation-tip">横屏体验更佳</div>
  <div id="mobile-joystick" aria-label="移动摇杆"><div id="mobile-stick"></div></div>
  <div id="mobile-skills">
    <button class="mobile-skill" data-skill="0" type="button"><span>棒</span><small>挥棒</small></button>
    <button class="mobile-skill" data-skill="1" type="button"><span>旋</span><small>旋舞</small></button>
    <button class="mobile-skill" data-skill="2" type="button"><span>劈</span><small>跳劈</small></button>
    <button class="mobile-skill" data-skill="3" type="button"><span>突</span><small>突进</small></button>
    <button class="mobile-skill" data-skill="4" type="button"><span>空</span><small>F</small></button>
    <button id="mobile-wushuang" type="button" aria-label="无双"><span>无双</span><small>0%</small></button>
  </div>
  <button id="mobile-pause" type="button" aria-label="暂停">Ⅱ</button>
</div>
<div id="cinematic-ui" aria-hidden="true">
  <div id="cinematic-flash"></div>
  <div id="cinematic-vignette"></div>
  <div id="cinematic-banner"><div class="line"></div><div id="cinematic-title"></div><div id="cinematic-sub"></div><div class="line"></div></div>
  <div id="skill-stamp"></div>
</div>
<script src="https://cdn.jsdelivr.net/npm/animejs@4.5.0/dist/bundles/anime.umd.min.js" onerror="console.warn('Anime.js CDN unavailable; Canvas VFX fallback active')"></script>
<script>
// === 全局错误捕获 ===
window.onerror = function(msg, src, line, col, err) {
  var d = document.getElementById('err');
  d.textContent = 'ERROR: ' + msg + '\nLine: ' + line + ':' + col + '\n' + (err && err.stack ? err.stack : '');
  d.style.display = 'block';
  return false;
};

(function() {
'use strict';

var canvas = document.getElementById('game');
var ctx = canvas.getContext('2d');

// === Anime.js V4 视觉动画桥（V4.0）===
// 页面会先加载官方 Anime.js UMD；网络不可用时仍回退到原有 Canvas 特效。
var ANIME = window.anime || null;
var animeAnimate = ANIME && ANIME.animate ? ANIME.animate : null;
var animeTimeline = ANIME && ANIME.createTimeline ? ANIME.createTimeline : null;
var animeEngine = ANIME && ANIME.engine ? ANIME.engine : null;
var animeAvailable = !!animeAnimate;
if (animeEngine) animeEngine.useDefaultMainLoop = false;

var cinematicFlashEl = document.getElementById('cinematic-flash');
var cinematicVignetteEl = document.getElementById('cinematic-vignette');
var cinematicBannerEl = document.getElementById('cinematic-banner');
var cinematicTitleEl = document.getElementById('cinematic-title');
var cinematicSubEl = document.getElementById('cinematic-sub');
var skillStampEl = document.getElementById('skill-stamp');

function screenFlash(color, alpha, duration) {
  if (!cinematicFlashEl) return;
  var a = alpha === undefined ? 0.45 : alpha;
  cinematicFlashEl.style.background = color || '#ffffff';
  cinematicFlashEl.style.opacity = String(a);
  if (animeAvailable) {
    animeAnimate(cinematicFlashEl, { opacity:[a,0], duration:duration || 260, ease:'out(4)' });
  } else {
    cinematicFlashEl.style.transition = 'opacity ' + (duration || 260) + 'ms ease-out';
    requestAnimationFrame(function(){ cinematicFlashEl.style.opacity='0'; });
  }
}
function showCinematic(title, sub, color, duration) {
  if (!cinematicBannerEl) return;
  cinematicTitleEl.textContent = title || '';
  cinematicSubEl.textContent = sub || '';
  cinematicBannerEl.style.color = color || '#ffe066';
  cinematicTitleEl.style.color = color || '#ffe066';
  cinematicBannerEl.style.opacity = '1';
  cinematicBannerEl.style.transform = 'translate(-50%,-50%) scale(.72)';
  if (cinematicVignetteEl) cinematicVignetteEl.style.opacity = '.48';
  if (animeAvailable && animeTimeline) {
    var tl = animeTimeline({ defaults:{ ease:'out(4)' } });
    tl.add(cinematicBannerEl,{ opacity:[0,1], scale:[0.72,1.08], duration:230 })
      .add(cinematicBannerEl,{ scale:1, duration:160 })
      .add(cinematicBannerEl,{ opacity:0, scale:1.05, duration:340, delay:Math.max(250,(duration||1300)-730) });
    animeAnimate(cinematicVignetteEl,{ opacity:[0,.52,0], duration:duration||1300, ease:'inOut(2)' });
  } else {
    cinematicBannerEl.style.transition='opacity .25s ease, transform .25s ease';
    requestAnimationFrame(function(){ cinematicBannerEl.style.transform='translate(-50%,-50%) scale(1)'; });
    setTimeout(function(){ cinematicBannerEl.style.opacity='0'; if(cinematicVignetteEl) cinematicVignetteEl.style.opacity='0'; }, duration||1300);
  }
}
function showSkillStamp(text, color) {
  if (!skillStampEl) return;
  skillStampEl.textContent = text;
  skillStampEl.style.color = color || '#ffe066';
  if (animeAvailable) {
    animeAnimate(skillStampEl,{ opacity:[0,1,0], scale:[0.55,1.16,1], rotate:[-8,-2,3], y:[12,0,-14], duration:620, ease:'out(4)' });
  } else {
    skillStampEl.style.opacity='1'; skillStampEl.style.transform='translate(-50%,-50%) scale(1) rotate(-2deg)';
    setTimeout(function(){ skillStampEl.style.opacity='0'; },420);
  }
}
function pulseMobileSkill(skillIndex) {
  if (!mobileMode) return;
  var el=document.querySelector('.mobile-skill[data-skill="'+skillIndex+'"]');
  if (!el) return;
  if (animeAvailable) animeAnimate(el,{ scale:[1,.82,1.15,1], duration:300, ease:'out(4)' });
}


// === 资源路径 ===
// 不再给本地 PNG 追加 ?v= 查询串，兼容直接双击 index.html 的 file:// 场景
function assetUrl(rel) {
  try { return new URL(rel, window.location.href).href; }
  catch (e) { return rel; }
}
function imageReady(img) {
  return !!(img && img.complete && img.naturalWidth > 0);
}

// === 尺寸 ===
function resize() {
  var vv = window.visualViewport;
  var w = Math.round((vv && vv.width) || window.innerWidth || document.documentElement.clientWidth || 800);
  var h = Math.round((vv && vv.height) || window.innerHeight || document.documentElement.clientHeight || 600);
  canvas.width = w;
  canvas.height = h;
  detectMobileMode();
  if (player) {
    player.x = Math.min(Math.max(player.x, 30), w - 30);
    player.y = Math.min(Math.max(player.y, 30), h - 30);
  }
}
window.addEventListener('resize', resize);
if (window.visualViewport) window.visualViewport.addEventListener('resize', resize);

// === 状态 ===
var ST = { START:0, WAVE_INTRO:1, PLAYING:2, WAVE_CLEAR:3, VICTORY:4, GAMEOVER:5, PAUSED:6, SKILL_CHOICE:7, SKILL_REPLACE:8 };
var state = ST.START;
var upgradeChoices = [];
var pendingReplacementSkill = null;

// === 输入 ===
var keys = {};
var justPressed = {};
var mobileMode = false;
var mobileUI = null;
var mobileJoy = { pointerId:null, x:0, y:0 };
function detectMobileMode() {
  try { mobileMode = window.matchMedia('(pointer: coarse)').matches || window.innerWidth <= 900; }
  catch (e) { mobileMode = window.innerWidth <= 900; }
  return mobileMode;
}
function clearMobileMovement() {
  keys.KeyW = keys.KeyA = keys.KeyS = keys.KeyD = false;
  mobileJoy.x = mobileJoy.y = 0;
  if (mobileUI && mobileUI.stick) mobileUI.stick.style.transform = 'translate(0px,0px)';
}
function startFromMobileIfNeeded() {
  if (state === ST.START) { init(); nextWave(); lastTime = performance.now(); }
}


// === 玩家精灵图 ===
// 使用 8 方向 × 3 帧的独立 PNG，方向明确无歧义
// 帧序：0=左脚 1=中间 2=右脚
// 方向：N(上/背) S(下/正面) E(右) W(左) NE NW SE SW
var SPR = {
  drawW: 96, drawH: 96,
  frameDur: 0.13,
  ready: false,
  loaded: 0, total: 0,
  frames: {},
  fallback: null
};
(function() {
  var dirs = ['N','NE','E','SE','S','SW','W','NW'];
  SPR.total = dirs.length * 3;
  dirs.forEach(function(d) {
    SPR.frames[d] = [];
    for (var f = 0; f < 3; f++) {
      (function(dir, frame) {
        var img = new Image();
        img.onload = function() { SPR.loaded++; SPR.ready = true; };
        img.onerror = function() { console.error('walk sprite load fail:', assetUrl('assets/sprites/walk/walk_' + dir + '_' + frame + '.png')); };
        img.src = assetUrl('assets/sprites/walk/walk_' + dir + '_' + frame + '.png');
        SPR.frames[dir].push(img);
      })(d, f);
    }
  });
  var fallback = new Image();
  fallback.onload = function() { SPR.ready = true; };
  fallback.onerror = function() { console.error('wukong fallback load fail:', assetUrl('assets/sprites/wukong.png')); };
  fallback.src = assetUrl('assets/sprites/wukong.png');
  SPR.fallback = fallback;
})();

// === 攻击精灵图 ===
// 普攻(normal): 8方向 × 2帧(0=蓄力, 1=挥出)
// 跳劈(jump):   8方向 × 2帧(0=腾空, 1=落地劈)
var ATK = {
  ready: false, loaded: 0, total: 0,
  frames: { normal: {}, jump: {} },  // frames[type][dir] = [img0, img1]
  normalDur: 0.3,   // 普攻动画时长
  jumpDur: 0.4      // 跳劈动画时长
};
(function() {
  var dirs = ['N','NE','E','SE','S','SW','W','NW'];
  var types = ['normal','jump'];
  ATK.total = dirs.length * types.length * 2;
  types.forEach(function(t) {
    dirs.forEach(function(d) {
      ATK.frames[t][d] = [];
      for (var f = 0; f < 2; f++) {
        var img = new Image();
        img.onload = function() { ATK.loaded++; ATK.ready = true; };
        img.onerror = function() { console.error('attack sprite load fail:', assetUrl('assets/sprites/attack/atk_' + t + '_' + d + '_' + f + '.png')); };
        img.src = assetUrl('assets/sprites/attack/atk_' + t + '_' + d + '_' + f + '.png');
        ATK.frames[t][d].push(img);
      }
    });
  });
})();

// === 背景图 ===
// 0=森林(1-3关) 1=天庭(4-7关) 2=岩浆(8-10关)，均 384×288 平铺
var BG = {
  imgs: [], loaded: 0,
  names: ['forest', 'heaven', 'lava'],
  loadedFlags: [false, false, false]
};
BG.names.forEach(function(n, i) {
  var img = new Image();
  img.onload = function() { BG.loaded++; BG.loadedFlags[i] = true; };
  img.onerror = function() { BG.loadedFlags[i] = false; console.error('background load fail:', assetUrl('assets/bg/' + n + '.png')); };
  img.src = assetUrl('assets/bg/' + n + '.png');
  BG.imgs[i] = img;
});


// === V4.0 场景视觉状态 ===
var sceneTransition = { active:false, from:0, to:0, start:0, dur:1100 };
function startSceneTransition(fromIdx, toIdx) {
  if (fromIdx === toIdx) return;
  sceneTransition = { active:true, from:fromIdx, to:toIdx, start:performance.now(), dur:1100 };
}
function roundedRectPath(x,y,w,h,r) {
  r=Math.max(0,Math.min(r,Math.min(w,h)/2));
  ctx.beginPath();
  ctx.moveTo(x+r,y); ctx.lineTo(x+w-r,y); ctx.quadraticCurveTo(x+w,y,x+w,y+r);
  ctx.lineTo(x+w,y+h-r); ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  ctx.lineTo(x+r,y+h); ctx.quadraticCurveTo(x,y+h,x,y+h-r);
  ctx.lineTo(x,y+r); ctx.quadraticCurveTo(x,y,x+r,y); ctx.closePath();
}
function drawImageCover(img, alpha, zoom) {
  if (!imageReady(img)) return false;
  var z=zoom || 1.04;
  var sw=img.naturalWidth||img.width, sh=img.naturalHeight||img.height;
  var scale=Math.max(canvas.width/sw,canvas.height/sh)*z;
  var dw=sw*scale, dh=sh*scale;
  var px=player ? (player.x/canvas.width-.5) : 0;
  var py=player ? (player.y/canvas.height-.5) : 0;
  var ox=(canvas.width-dw)/2-px*10, oy=(canvas.height-dh)/2-py*7;
  ctx.save(); ctx.globalAlpha=alpha===undefined?1:alpha; ctx.drawImage(img,ox,oy,dw,dh); ctx.restore();
  return true;
}

// === 玩家 ===
var player;
function makePlayer() {
  return {
    x: canvas.width/2, y: canvas.height/2,
    w:32, h:48, hp:100, maxHp:100, speed:3,
    facing:'right', level:1, kills:0,
    inv:false, invT:0, dash:false, dashT:0,
    vx:0, vy:0,
    dir:'S', frameIdx:1, frameT:0, moving:false,
    attack:null, jump:null, spin:null,
    combo:0, comboT:0,
    fury:0, maxFury:100, furyGainMult:1,
    wushuang:false, wushuangT:0, wushuangDur:8,
    fireEyeT:0, fireEyePower:1,
    critChance:0, summonDamageMult:1, enemyBulletSpeedFactor:1,
    reviveCharges:0,
    relics:{}, pendingUpgrades:0
  };
}

// === V4.1 技能构筑 ===
var skills;
var summons = [];
var playerProjectiles = [];
var lootDrops = [];
var monsterUidSeq = 1;

var ACTIVE_KEYS = [
  {key:'KeyQ', alt:'ArrowLeft', label:'Q'},
  {key:'KeyE', alt:'ArrowUp', label:'E'},
  {key:'KeyR', alt:'ArrowRight', label:'R'},
  {key:'KeyF', alt:'ArrowDown', label:'F'}
];

var SKILL_TEMPLATES = {
  spin: {id:'spin', nm:'乾坤旋舞', icon:'旋', bdmg:12, cd:3.0, ty:'circle', rad:155, color:'#ffcf5a', level:1, maxLevel:5, duration:0.55, desc:'近身旋转扫击并清除弹幕'},
  jump: {id:'jump', nm:'腾云跳劈', icon:'劈', bdmg:20, cd:5.0, ty:'sector', rad:150, ang:225, anim:'jump', color:'#ff9f1c', level:1, maxLevel:5, desc:'跃向前方，落地造成大范围伤害'},
  dash: {id:'dash', nm:'筋斗突进', icon:'突', bdmg:20, cd:5.0, ty:'dash', rng:150, dist:160, color:'#8bd3ff', level:1, maxLevel:5, desc:'高速突进并在落点爆发'},
  heal: {id:'heal', nm:'仙桃回元', icon:'桃', bdmg:0, cd:10.0, ty:'heal', hl:20, color:'#7CFC9A', level:1, maxLevel:5, desc:'恢复生命，后期可获得护盾式生存能力'},

function cloneSkill(id) {

}

}

function upgradeSkill(sk) {
  if (!sk || sk.id==='basic' || sk.level>=sk.maxLevel) return false;
  sk.level++;
  switch(sk.id) {
    case 'spin': sk.bdmg+=4; sk.rad+=8; sk.duration+=0.04; break;
    case 'jump': sk.bdmg+=5; sk.rad+=8; break;
    case 'dash': sk.bdmg+=5; sk.rng+=8; sk.dist+=12; break;
    case 'heal': sk.hl+=5; sk.cd=Math.max(6,sk.cd-0.5); break;
    case 'clone': sk.bdmg+=2; sk.duration+=0.8; if(sk.level===3||sk.level===5) sk.count++; break;
    case 'army': sk.bdmg+=1.5; sk.duration+=0.7; if(sk.level===2||sk.level===4) sk.count++; break;
    case 'fireEye': sk.duration+=0.8; sk.power+=0.08; sk.critBonus+=0.03; break;
    case 'staffWave': sk.bdmg+=4; if(sk.level===3||sk.level===5) sk.count++; if(sk.level>=4) sk.pierce=2; break;

function makeUpgradeChoicePool() {
  var choices=[];
  var owned=ownedSkillIds();
  var newIds=Object.keys(SKILL_TEMPLATES).filter(function(id){return !owned[id];});
  var upgradable=[];
  for(var i=1;i<=4;i++) if(skills[i] && skills[i].level<skills[i].maxLevel) upgradable.push(skills[i]);

  // 尚未满4技能时，保证至少出现一个新技能。
  if(activeSkillCount()<4 && newIds.length){
    var id=randomPick(newIds);
    choices.push({kind:'new', id:id, title:SKILL_TEMPLATES[id].nm, color:SKILL_TEMPLATES[id].color, desc:'新技能 · '+SKILL_TEMPLATES[id].desc});
    newIds=newIds.filter(function(x){return x!==id;});
  }
  var guard=0;
  while(choices.length<3 && guard++<30){
    var roll=Math.random();
    var c=null;
    if(upgradable.length && roll<0.50){
      var sk=randomPick(upgradable);
      c={kind:'upgrade', slot:sk.slot, title:sk.nm+' Lv.'+(sk.level+1), color:sk.color, desc:skillUpgradeDesc(sk)};
    } else if(newIds.length && (activeSkillCount()<4 || Math.random()<0.35)) {
      var nid=randomPick(newIds);
      c={kind:'new', id:nid, title:SKILL_TEMPLATES[nid].nm, color:SKILL_TEMPLATES[nid].color, desc:(activeSkillCount()>=4?'换技候选 · ':'新技能 · ')+SKILL_TEMPLATES[nid].desc};
    } else {
      var st=randomPick(STAT_UPGRADES);
      c={kind:'stat', id:st.id, title:st.title, color:st.color, desc:st.desc};
    }
    if(c && !choices.some(function(x){return x.kind===c.kind && x.id===c.id && x.slot===c.slot;})) choices.push(c);
  }
  return choices.slice(0,3);
}

function prepareUpgradeChoices() {

  state=ST.SKILL_CHOICE;
}

function makeMonster(x, y, plv) {
  // V3.1 小怪平衡：保留职业差异，但整体降低血量、伤害与弹速
  var models = [
    { key:'imp',     w:30, h:30, hp:45, atk:3, bulletDmg:2, spd:28, shootCd:[2.6, 3.5], bulletSpd:120, bulletR:5, color:'#ff8844' },
    { key:'brute',   w:38, h:38, hp:78, atk:4, bulletDmg:3, spd:20, shootCd:[3.0, 4.0], bulletSpd:110, bulletR:6, color:'#c84b31' },
    { key:'specter', w:28, h:36, hp:52, atk:3, bulletDmg:2, spd:32, shootCd:[2.2, 3.1], bulletSpd:140, bulletR:4, color:'#6ad7ff' },
    { key:'spider',  w:34, h:26, hp:58, atk:3, bulletDmg:2, spd:38, shootCd:[2.4, 3.3], bulletSpd:130, bulletR:4, color:'#9f7aea' }
  ];
  var model = models[Math.floor(Math.random() * models.length)];

  var variant = 'normal';
  var r = Math.random();
  // V3.1：黄色强化怪从 30% 降到 15%，普通怪提高到 55%
  if (r < 0.55) variant = 'normal';
  else if (r < 0.70) variant = 'blue';
  else if (r < 0.85) variant = 'red';
  else variant = 'yellow';

  var hp = model.hp, atk = model.atk, bulletDmg = model.bulletDmg, spd = model.spd, bulletSpd = model.bulletSpd;
  // 变异只做轻量强化，避免黄色/红色小怪瞬间跨越普通怪强度档位
  if (variant === 'blue') { spd *= 1.18; bulletSpd *= 1.05; }
  if (variant === 'red') { atk += 2; bulletDmg += 1; }
  if (variant === 'yellow') { hp *= 1.35; atk *= 1.25; bulletDmg *= 1.25; spd *= 1.10; bulletSpd *= 1.06; }

  // V3.3：所有小怪生命值在当前平衡版基础上翻倍
  hp *= 2;

  // V3.5：大圣每完成一次升级，非Boss怪物针对该次升级独立进行一次30%概率判定。
  // 判定成功时，该怪物最大生命值增加“自身原始最大生命值”的1/3。
  // 对以后新生成的怪物，会补做玩家此前所有升级次数的独立30%判定，保证规则覆盖“这关及以后”。
  // baseMaxHp 包含怪物类型、变异以及V3.3翻倍，但不包含玩家等级成长。
  var baseMaxHp = Math.round(hp);
  var levelSteps = Math.max(0, (plv || 1) - 1);
  var hpGrowthSteps = 0;
  for (var gs = 0; gs < levelSteps; gs++) {
    if (Math.random() < 0.30) hpGrowthSteps++;
  }
  var growthPerStep = Math.round(baseMaxHp / 3);
  hp = baseMaxHp + hpGrowthSteps * growthPerStep;

  // V4.1 精英怪：第3关后开始出现，基础概率随关卡略增。
  var elite = (wave && wave.cur >= 3) ? (Math.random() < Math.min(0.08 + wave.cur * 0.008, 0.16)) : false;
  var eliteType = null;
  if (elite) {
    eliteType = randomPick(['berserker','armored','barrage']);
    hp *= eliteType === 'armored' ? 2.3 : 1.8;
    if (eliteType === 'berserker') { spd *= 1.28; atk *= 1.18; }
    if (eliteType === 'barrage') { bulletSpd *= 1.06; bulletDmg *= 1.15; }
    baseMaxHp = Math.round(baseMaxHp * (eliteType === 'armored' ? 2.3 : 1.8));
  }
  hp = Math.round(hp);

  return {
    uid:monsterUidSeq++, x:x, y:y, w:model.w, h:model.h,
    hp:hp, maxHp:hp, baseMaxHp:baseMaxHp, hpGrowthSteps:hpGrowthSteps, boss:false, model:model.key,
    elite:elite, eliteType:eliteType,
    renderScaleX:1, renderScaleY:1, renderAlpha:1, renderRot:0,
    speed:spd, baseDmg:Math.max(1, Math.round(atk)), bulletDmg:Math.max(1, Math.round(bulletDmg)), dmgR:0,
    acd:0, flash:0, vx:0, vy:0, spinCd:0,
    variant: variant,
    bulletCd: model.shootCd[0] + Math.random() * (model.shootCd[1] - model.shootCd[0]),
    bulletCdMin: eliteType === 'barrage' ? model.shootCd[0] * 0.68 : model.shootCd[0], bulletCdMax: eliteType === 'barrage' ? model.shootCd[1] * 0.72 : model.shootCd[1],
    bulletSpd: bulletSpd, bulletR: model.bulletR, bulletColor: model.color,
    shootRange: 460
  };
}

function drawAnimeVfx() {
  for (var i = 0; i < animeVfx.length; i++) {
    var o = animeVfx[i];
    ctx.save();
    ctx.globalAlpha = Math.max(0, Math.min(1, o.alpha));
    ctx.translate(o.x, o.y); ctx.rotate(o.rotation || 0); ctx.scale(o.scale || 1, o.scale || 1);
    ctx.strokeStyle = o.color; ctx.fillStyle = o.color; ctx.shadowColor = o.color; ctx.shadowBlur = 18;
    if (o.type === 'animeSlash') {
      var half = (o.ang || 95) * Math.PI / 360;
      ctx.lineWidth = 14;
      ctx.beginPath(); ctx.arc(0, 0, o.radius * 0.82, -half, half); ctx.stroke();
      ctx.globalAlpha *= 0.45; ctx.lineWidth = 5;
      ctx.beginPath(); ctx.arc(0, 0, o.radius, -half * 1.08, half * 1.08); ctx.stroke();
    } else if (o.type === 'animeSpin') {
      ctx.lineWidth = o.width || 9;
      for (var k=0;k<3;k++) { ctx.beginPath(); ctx.arc(0,0,o.radius*(0.62+k*0.16),k*1.7,k*1.7+Math.PI*1.25); ctx.stroke(); }
    } else if (o.type === 'animeCloud') {
      ctx.lineWidth = 8;
      for (var c=0;c<5;c++) { var aa=c*Math.PI*2/5; ctx.beginPath(); ctx.arc(Math.cos(aa)*o.radius*0.18,Math.sin(aa)*o.radius*0.10,o.radius*(0.18+c*0.018),0,Math.PI*2); ctx.stroke(); }
    } else if (o.type === 'animeDash') {
      ctx.lineWidth = o.width || 18; ctx.lineCap='round';
      ctx.beginPath(); ctx.moveTo(-o.radius*0.8,0); ctx.lineTo(o.radius*0.25,0); ctx.stroke();
      ctx.globalAlpha *= 0.55; ctx.lineWidth = 7;
      ctx.beginPath(); ctx.moveTo(-o.radius, -18); ctx.lineTo(o.radius*0.1,-18); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(-o.radius, 18); ctx.lineTo(o.radius*0.1,18); ctx.stroke();
    } else if (o.type === 'animeHeal') {
      ctx.lineWidth = o.width || 8;
      ctx.beginPath(); ctx.arc(0,0,o.radius,0,Math.PI*2); ctx.stroke();
      for (var h=0;h<6;h++) { var ha=h*Math.PI/3; ctx.beginPath(); ctx.moveTo(Math.cos(ha)*o.radius*0.35,Math.sin(ha)*o.radius*0.35); ctx.lineTo(Math.cos(ha)*o.radius*0.9,Math.sin(ha)*o.radius*0.9); ctx.stroke(); }
    } else if (o.type === 'staffTrail') {
      ctx.lineCap='round'; ctx.lineWidth=o.width||7;
      ctx.beginPath(); ctx.arc(0,0,o.radius*.78,-.42,.42); ctx.stroke();
      ctx.globalAlpha*=.45; ctx.beginPath(); ctx.arc(0,0,o.radius,-.55,.55); ctx.stroke();
    } else if (o.type === 'spinBlade') {
      ctx.lineCap='round'; ctx.lineWidth=o.width||7;
      ctx.beginPath(); ctx.arc(0,0,o.radius,-.7,.85); ctx.stroke();
      ctx.beginPath(); ctx.arc(0,0,o.radius,Math.PI-.7,Math.PI+.85); ctx.stroke();
    } else if (o.type === 'healPetals') {
      ctx.lineWidth=o.width||5;
      for(var hp=0;hp<8;hp++){var pa=hp*Math.PI/4; ctx.save(); ctx.rotate(pa); ctx.beginPath(); ctx.ellipse(o.radius*.62,0,o.radius*.22,o.radius*.09,0,0,Math.PI*2); ctx.stroke(); ctx.restore();}
    } else if (o.type === 'impactRing') {
      ctx.lineWidth=o.width||5; ctx.beginPath(); ctx.arc(0,0,o.radius,0,Math.PI*2); ctx.stroke();
    } else if (o.type === 'impactStar' || o.type === 'verticalBurst') {
      ctx.lineWidth=o.width||6;
      var rays=o.type==='verticalBurst'?8:12;
      for(var st=0;st<rays;st++){var sa=st*Math.PI*2/rays; var inner=o.radius*.18,outer=o.radius*(st%2?.65:1); ctx.beginPath();ctx.moveTo(Math.cos(sa)*inner,Math.sin(sa)*inner);ctx.lineTo(Math.cos(sa)*outer,Math.sin(sa)*outer);ctx.stroke();}
    } else if (o.type === 'bossSeal') {
      ctx.lineWidth=o.width||8;
      ctx.beginPath();ctx.arc(0,0,o.radius*.72,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();ctx.arc(0,0,o.radius,0,Math.PI*2);ctx.stroke();
      ctx.beginPath();for(var bs=0;bs<6;bs++){var ba=bs*Math.PI/3-Math.PI/2;var px=Math.cos(ba)*o.radius*.82,py=Math.sin(ba)*o.radius*.82;if(bs===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);}ctx.closePath();ctx.stroke();
    } else if (o.type === 'bossArrival' || o.type === 'bossPhaseBurst') {
      ctx.lineWidth = o.width || 12;

// === 初始化 ===
function init() {
  upgradeChoices = []; pendingReplacementSkill = null;

  enemyBullets = [];

  sceneTransition = { active:false, from:0, to:0, start:0, dur:1100 };
  for (var k in justPressed) delete justPressed[k];
}

// 先 resize 再 init
resize();

// === 下一波 ===
function nextWave() {
  var previousSceneIdx=getBackgroundIndexForWave(Math.max(1,wave.cur||1));
  wave.cur++;
  // 跳过下一关：再进一关，清除标记(不超过总关数)
  if (player.skipNextWave && wave.cur < wave.total) {
    player.skipNextWave = false;
    wave.cur++;
  }
  var nextSceneIdx=getBackgroundIndexForWave(Math.max(1,wave.cur||1));
  if(nextSceneIdx!==previousSceneIdx) startSceneTransition(previousSceneIdx,nextSceneIdx);
  wave.bossWave = (wave.cur % 10 === 0);
  wave.perWave = wave.bossWave ? 1 : wave.cur * 2;
  wave.spawned = 0;
  wave.spawnT = 0;
  wave.interval = wave.bossWave ? 1.6 : 3;
  wave.maxField = wave.bossWave ? 1 : 15;
  wave.eliteSpawned = false;
  state = ST.WAVE_INTRO;
  wave.timer = wave.bossWave ? 2.6 : 2.0;
  if (wave.bossWave) { showCinematic('第 ' + wave.cur + ' 关','BOSS 战','#ff4d6d',1200); screenFlash('#7a001f',0.16,240); }
  else if (wave.cur === 4) { showCinematic('南天门','天庭 · 云海战场','#7fd8ff',1200); screenFlash('#d9f4ff',0.18,260); }
  else if (wave.cur === 8) { showCinematic('火焰山','熔岩 · 灼热战场','#ff8a4c',1200); screenFlash('#ff5a2a',0.18,260); }
  // 第4关进入：玩家 maxHp+50 并回血50(立即生效)
  if (wave.cur === 4) {
    player.maxHp += 50;
    player.hp = Math.min(player.hp + 50, player.maxHp);
  }
  // 第8关进入：移除玩家血量加成
  if (wave.cur === 8) {
    player.maxHp = Math.max(1, player.maxHp - 50);
    player.hp = Math.min(player.hp, player.maxHp);
  }
}

// === 生成怪物 ===
function spawnMonster() {
  var e = Math.floor(Math.random()*4), mrg = 50, x, y, att = 0;
  do {
    if (e===0) { x = mrg+Math.random()*(canvas.width-2*mrg); y = mrg; }
    else if (e===1) { x = canvas.width-mrg; y = mrg+Math.random()*(canvas.height-2*mrg); }
    else if (e===2) { x = mrg+Math.random()*(canvas.width-2*mrg); y = canvas.height-mrg; }
    else { x = mrg; y = mrg+Math.random()*(canvas.height-2*mrg); }
    att++;
  } while (att<50 && Math.hypot(x-player.x, y-player.y)<180);
  var spawnedMonster = wave.bossWave ? makeBoss(x, y, wave.cur) : makeMonster(x, y, player.level);
  if (!wave.bossWave && (wave.cur===5 || wave.cur===9) && !wave.eliteSpawned && !spawnedMonster.elite) {
    spawnedMonster.elite=true; spawnedMonster.eliteType='armored'; spawnedMonster.maxHp=Math.round(spawnedMonster.maxHp*1.8); spawnedMonster.hp=spawnedMonster.maxHp; spawnedMonster.baseDmg=Math.round(spawnedMonster.baseDmg*1.15);
  }
  if (spawnedMonster.elite) wave.eliteSpawned=true;
  monsters.push(spawnedMonster);
  animeSpawn(spawnedMonster);
}

function fireEnemyBullet(x, y, angle, speed, dmg, r, color, life) {
  if (enemyBullets.length >= 420) return;
  enemyBullets.push({
    x:x, y:y, vx:Math.cos(angle)*speed, vy:Math.sin(angle)*speed,
    r:r || 5, dmg:dmg || 6, color:color || '#ff8844', life:life || 5
  });
}

function fireAimedShot(m, spread) {
  var a = Math.atan2(player.y - m.y, player.x - m.x);
  fireEnemyBullet(m.x, m.y, a + (spread || 0), m.bulletSpd, m.bulletDmg || m.baseDmg, m.bulletR, m.bulletColor, 5);
}

function fireBossBurst(m) {
  var aim = Math.atan2(player.y - m.y, player.x - m.x);
  var count = m.phase === 2 ? 9 : 7;
  var half = (count - 1) / 2;
  var spread = m.phase === 2 ? 0.13 : 0.16;
  for (var i = 0; i < count; i++) {
    var off = (i - half) * spread;
    fireEnemyBullet(m.x, m.y, aim + off, m.bulletSpd + i * 3, m.baseDmg, m.phase === 2 ? 6 : 7, m.phase === 2 ? '#ff2e63' : '#ff4d6d', 5.2);
  }
}

function fireBossRing(m) {
  var count = m.phase === 2 ? 18 : 12;
  var offset = m.spiralAngle || 0;
  for (var i = 0; i < count; i++) {
    fireEnemyBullet(m.x, m.y, offset + (Math.PI * 2 / count) * i, m.bulletSpd * 0.82, m.bossRingDmg, 5, m.phase === 2 ? '#ff77a8' : '#ff99aa', 5.8);
  }
}

function fireBossSpiral(m) {
  var arms = 3;
  for (var i = 0; i < arms; i++) {
    fireEnemyBullet(m.x, m.y, m.spiralAngle + i * Math.PI * 2 / arms, m.bulletSpd * 0.88, m.bossSpiralDmg, 5, '#ffa3c2', 6);
  }
  m.spiralAngle += 0.28;
}

// === 碰撞 ===
// 8 方向 → 朝向弧度(canvas 坐标系：x右为0，y下为正)
var DIR_ANGLES = {
  E:0, SE:Math.PI/4, S:Math.PI/2, SW:3*Math.PI/4,
  W:Math.PI, NW:-3*Math.PI/4, N:-Math.PI/2, NE:-Math.PI/4
};
function rectHit(a, b) {
  return Math.abs(a.x-b.x) < (a.w+b.w)/2 && Math.abs(a.y-b.y) < (a.h+b.h)/2;
}
function getDist(a, b) { return Math.hypot(a.x-b.x, a.y-b.y); }
function sectorHit(m, cx, cy, fa, r, ha) {  // fa=朝向弧度，r=半径，ha=半角(度)
  var d = Math.hypot(m.x-cx, m.y-cy);
  if (d > r) return false;
  var diff = Math.atan2(m.y-cy, m.x-cx) - fa;
  while (diff > Math.PI) diff -= 2*Math.PI;
  while (diff < -Math.PI) diff += 2*Math.PI;
  return Math.abs(diff) <= ha*Math.PI/180;
}

function clampPlayer() {
  player.x = Math.max(player.w/2, Math.min(canvas.width-player.w/2, player.x));
  player.y = Math.max(player.h/2, Math.min(canvas.height-player.h/2, player.y));
}

// === 技能 ===
// 8 方向单位向量(用于突进位移)
var DIR_VECTORS = {
  N:{x:0,y:-1}, NE:{x:0.707,y:-0.707}, E:{x:1,y:0}, SE:{x:0.707,y:0.707},
  S:{x:0,y:1}, SW:{x:-0.707,y:0.707}, W:{x:-1,y:0}, NW:{x:-0.707,y:-0.707}
};
function useSkill(sk) {
  if (!sk) return;
  var dmg = sk.bdmg || 0;
  var skIndex = skills.indexOf(sk);
  if (skIndex > 0) showSkillStamp(sk.nm, sk.color || '#ffe066');
  switch (sk.ty) {
    case 'sector':
      var sfa = DIR_ANGLES[player.dir] !== undefined ? DIR_ANGLES[player.dir] : 0;
      monsters.forEach(function(m) {
        if (sectorHit(m, player.x, player.y, sfa, sk.rad, sk.ang)) damageMonster(m, dmg, sk.id==='basic'?'basic':'skill');
      });
      var animType = sk.anim || 'jump';
      var animDur = animType === 'normal' ? ATK.normalDur : ATK.jumpDur;
      player.attack = { type: animType, dir: player.dir, t:0, dur: animDur, active:true };
      addSlashEffect(player.dir, sk.rad, sk.ang, sk.color || '#ffd166', animType === 'jump' ? 0.34 : 0.24);
      animateSkillVfx(animType === 'jump' ? 'jump' : 'slash', sk);
      if (animType === 'jump') { addBurstEffect(player.x, player.y, '#ffc46b', 0.3, 52, 8); shake(4, 0.12); }
      else { addBurstEffect(player.x, player.y, '#ffe7a8', 0.22, 40, 6); shake(2,0.08); }
      break;
    case 'circle':
      player.spin = { t:0, dur:sk.duration || 0.55, dmg:dmg, rng:sk.rad, active:true, fxT:0 };
      player.dash = true; player.dashT = Math.min(0.55, sk.duration || 0.55);
      addRingEffect(player.x, player.y, sk.color || '#ffcf5a', 0.55, 22, sk.rad, 8);
      animateSkillVfx('spin', sk);
      addBurstEffect(player.x, player.y, '#ffe7a8', 0.32, sk.rad * 0.72, 12);
      clearEnemyBulletsInRadius(player.x, player.y, sk.rad * 0.82);
      shake(4, 0.15);
      break;
    case 'dash':
      var dv = DIR_VECTORS[player.dir] || DIR_VECTORS.E;
      player.jump = { fromX:player.x, fromY:player.y, vx:dv.x, vy:dv.y, dist:sk.dist || 160, t:0, dur:0.4, dmg:dmg, rng:sk.rng, active:true, hit:false };
      player.attack = { type:'jump', dir:player.dir, t:0, dur:0.4, active:true };
      player.dash = true; player.dashT = 0.4;
      addSlashEffect(player.dir, sk.rng, 80, sk.color || '#8bd3ff', 0.18);
      animateSkillVfx('dash', sk); addBurstEffect(player.x, player.y, '#c9f1ff', 0.24, 46, 7); shake(3,0.12);
      break;
    case 'heal':
      player.hp = Math.min(player.hp + sk.hl, player.maxHp);
      spawnP(player.x, player.y, 10, '#44ff44'); addHealBurst(); animateSkillVfx('heal', sk);
      break;
    case 'clone':
      spawnSummons(sk,'clone');
      addRingEffect(player.x,player.y,sk.color,0.45,18,105,6); addBurstEffect(player.x,player.y,sk.color,0.3,80,10);
      break;
    case 'army':
      spawnSummons(sk,'army');
      addRingEffect(player.x,player.y,sk.color,0.55,20,125,7); addBurstEffect(player.x,player.y,sk.color,0.4,105,14);
      break;
    case 'buff':
      player.fireEyeT=sk.duration; player.fireEyePower=sk.power; player.fireEyeCritBonus=sk.critBonus;
      addRingEffect(player.x,player.y,sk.color,0.65,18,130,8); screenFlash(sk.color,0.08,160);
      break;
    case 'wave':
      fireStaffWave(sk);
      addSlashEffect(player.dir,110,65,sk.color,0.2); addBurstEffect(player.x,player.y,sk.color,0.22,55,7);
      break;
  }
}

// === AI ===
var aiTimer = 0;
var AI_INT = 0.5;

function updateAI() {
  monsters.forEach(function(m) {
    var dx = player.x - m.x, dy = player.y - m.y;
    var d = Math.hypot(dx, dy) || 1;
    var desired = m.boss ? 220 : 140;
    if (d > desired) {
      m.vx = (dx/d) * m.speed;
      m.vy = (dy/d) * m.speed;
    } else if (d < desired * 0.65) {
      m.vx = -(dx/d) * m.speed * 0.75;
      m.vy = -(dy/d) * m.speed * 0.75;
    } else {
      var side = Math.atan2(dy, dx) + Math.PI/2;
      var dir = Math.random() < 0.5 ? -1 : 1;
      m.vx = Math.cos(side) * m.speed * 0.7 * dir;
      m.vy = Math.sin(side) * m.speed * 0.7 * dir;
    }
  });
}

// === 更新 ===
function update(dt) {
  if (state !== ST.PLAYING) return;

  // 冷却：无双期间技能恢复速度+50%
  var cdRate = player.wushuang ? 1.5 : 1;
  skills.forEach(function(s) { if (s && s.t < s.cd) s.t = Math.min(s.cd, s.t + dt * cdRate); });
  if (player.fireEyeT > 0) player.fireEyeT = Math.max(0, player.fireEyeT - dt);
  if (player.wushuang) { player.wushuangT -= dt; if (player.wushuangT <= 0) { player.wushuang=false; player.wushuangT=0; showCinematic('无双结束','战意归静','#f4d06f',650); } }

  // 移动
  if (player.dash) {
    player.dashT -= dt;
    if (player.dashT <= 0) player.dash = false;
  } else {
    var dx = 0, dy = 0;
    var up = keys['KeyW'], dn = keys['KeyS'], lf = keys['KeyA'], rt = keys['KeyD'];
    var moveSpeed = player.speed * (player.wushuang ? 1.25 : 1);
    if (up) dy = -moveSpeed;
    if (dn) dy = moveSpeed;
    if (lf) { dx = -moveSpeed; }
    if (rt) { dx = moveSpeed; }
    // 朝向简化：左移(含左上/左下)→left，其他所有情况(右/上/下/静止/右上/右下)→right
    player.facing = (lf && !rt) ? 'left' : 'right';
    if (dx && dy) { dx *= 0.707; dy *= 0.707; }
    player.x += dx; player.y += dy;
    clampPlayer();

    // 计算 8 方向 dir
    player.moving = (dx !== 0 || dy !== 0);
    if (player.moving) {
      if (up && rt) player.dir = 'NE';
      else if (up && lf) player.dir = 'NW';
      else if (dn && rt) player.dir = 'SE';
      else if (dn && lf) player.dir = 'SW';
      else if (up) player.dir = 'N';
      else if (dn) player.dir = 'S';
      else if (rt) player.dir = 'E';
      else if (lf) player.dir = 'W';
    }
    // 静止时保持上次移动方向，不重置

    // 帧动画推进
    if (player.moving) {
      player.frameT += dt;
      if (player.frameT >= SPR.frameDur) {
        player.frameT -= SPR.frameDur;
        // 循环顺序 1(中) → 0(左脚) → 1(中) → 2(右脚) → 1(中) ...
        var seq = [1, 0, 1, 2];
        var pos = seq.indexOf(player.frameIdx);
        pos = (pos < 0) ? 0 : (pos + 1) % seq.length;
        player.frameIdx = seq[pos];
      }
    } else {
      player.frameIdx = 1;  // 静止回到中间帧
      player.frameT = 0;
    }
  }

  // 无敌
  if (player.inv) { player.invT -= dt; if (player.invT <= 0) player.inv = false; }

  // 基础普攻 + 4个主动技能槽；Q/E/R/F 与方向键均可触发技能槽。
  if (!player.dash) {
    var basic=skills[0];
    if (basic && justPressed.Space && basic.t>=basic.cd) { basic.t=0; useSkill(basic); }
    for (var si=1;si<=4;si++) {
      var sk=skills[si]; if(!sk) continue;
      if ((justPressed[sk.key] || justPressed[sk.altKey]) && sk.t>=sk.cd) { sk.t=0; useSkill(sk); }
    }
    if (justPressed.KeyX || justPressed.ShiftLeft || justPressed.ShiftRight) activateWushuang();
  }
  for (var k in justPressed) delete justPressed[k];

  // 攻击动画计时器推进
  if (player.attack && player.attack.active) {
    player.attack.t += dt;
    if (player.attack.t >= player.attack.dur) {
      player.attack.active = false;
      player.attack = null;
    }
  }

  // 跳跃劈击推进(技能4)：抛物线位移 + 落地圆形判定 + 大光效
  if (player.jump && player.jump.active) {
    var j = player.jump;
    j.t += dt;
    var prog = Math.min(j.t / j.dur, 1);
    player.x = j.fromX + j.vx * j.dist * prog;
    player.y = j.fromY + j.vy * j.dist * prog;
    clampPlayer();
    addAfterImage(player.x, player.y, player.dir, 0.16, 0.22);
    if (prog >= 1 && !j.hit) {
      j.hit = true; j.active = false; player.jump = null;
      // 落地圆形判定(比原矩形更大覆盖)
      monsters.forEach(function(m) {
        if (getDist(m, player) <= j.rng) {
          damageMonster(m, j.dmg, 'skill');
        }
      });
      // 落地大光效：更多粒子 + 光圈
      spawnP(player.x, player.y, 18, '#ffcc44');
      addRingEffect(player.x, player.y, '#ffd166', 0.42, 18, j.rng + 20, 7);
      addBurstEffect(player.x, player.y, '#ffe8b0', 0.36, j.rng * 0.9, 14);
      animeImpactAt(player.x, player.y, '#ffae42', j.rng + 35);
      clearEnemyBulletsInRadius(player.x, player.y, j.rng + 25);
      shake(8, 0.22);
      fx.landLight = { x: player.x, y: player.y, t: 0, dur: 0.25 };
    }
  }

  // 旋转扫击推进(技能2)：持续圆形判定，每只怪物0.3s受击冷却
  if (player.spin && player.spin.active) {
    var sp = player.spin;
    sp.t += dt;
    sp.fxT -= dt;
    if (sp.fxT <= 0) {
      addRingEffect(player.x, player.y, '#ffcf5a', 0.16, sp.rng * 0.55, sp.rng * 0.95, 5);
      addBurstEffect(player.x, player.y, '#ffe9a8', 0.14, sp.rng * 0.7, 8);
      clearEnemyBulletsInRadius(player.x, player.y, sp.rng * 0.82);
      sp.fxT = 0.12;
    }
    monsters.forEach(function(m) {
      if (m.spinCd > 0) m.spinCd -= dt;
      if (m.spinCd <= 0 && getDist(m, player) <= sp.rng) {
        damageMonster(m, sp.dmg, 'skill'); m.spinCd = 0.3;
      }
    });
    if (sp.t >= sp.dur) { sp.active = false; player.spin = null; }
  }

  updateSummons(dt);
  updatePlayerProjectiles(dt);
  updateLoot(dt);

  // 怪物移动 / 敌方弹幕
  monsters.forEach(function(m) {
    m.x += m.vx * dt; m.y += m.vy * dt;
    m.x = Math.max(m.w/2, Math.min(canvas.width-m.w/2, m.x));
    m.y = Math.max(m.h/2, Math.min(canvas.height-m.h/2, m.y));

    if (m.boss && !m.phaseTriggered && m.hp <= m.maxHp * 0.5) {
      m.phaseTriggered = true; m.phase = 2; m.phaseFlash = 1.2;
      m.speed *= 1.2; m.bulletSpd *= 1.18;
      m.bulletCdMin = 0.45; m.bulletCdMax = 0.725;
      m.patternT = 1.375; m.spiralT = 0.10;
      fx.bossPhase = 1.4;
      animeBossPhase(m);
      addRingEffect(m.x, m.y, '#ff2e63', 0.8, 30, 170, 9);
      clearEnemyBulletsInRadius(m.x, m.y, 90);
      shake(11, 0.45);
    }
    if (m.phaseFlash > 0) m.phaseFlash -= dt;

    m.bulletCd -= dt;
    var distToPlayer = getDist(m, player);
    if (m.bulletCd <= 0 && distToPlayer <= m.shootRange) {
      if (m.boss) {
        fireBossBurst(m);
        if (m.phase === 2 && Math.random() < 0.38) fireBossRing(m);
        m.bulletCd = m.bulletCdMin + Math.random() * (m.bulletCdMax - m.bulletCdMin);
      } else {
        if (m.model === 'brute') {
          // 重甲怪仍是三连扇形，但射速慢、弹速低
          fireAimedShot(m, -0.13); fireAimedShot(m, 0); fireAimedShot(m, 0.13);
        } else if (m.model === 'specter') {
          fireAimedShot(m, -0.08); fireAimedShot(m, 0.08);
        } else if (m.model === 'spider') {
          fireAimedShot(m, 0);
          if (Math.random() < 0.22) { fireAimedShot(m, -0.18); fireAimedShot(m, 0.18); }
        } else {
          fireAimedShot(m, 0);
        }
        // 黄色怪不再固定额外双发，只保留低概率额外单发
        if (m.variant === 'yellow' && Math.random() < 0.20) fireAimedShot(m, 0.09);
        m.bulletCd = m.bulletCdMin + Math.random() * (m.bulletCdMax - m.bulletCdMin);
      }
    }

    if (m.patternT !== undefined) {
      m.patternT -= dt;
      m.aura += dt * 2;
      if (m.patternT <= 0) {
        fireBossRing(m);
        m.patternT = m.phase === 2 ? 1.6875 : 3.0;
      }
      if (m.phase === 2) {
        m.spiralT -= dt;
        if (m.spiralT <= 0) { fireBossSpiral(m); m.spiralT = 0.225; }
      }
    }
  });

  enemyBullets.forEach(function(b) {
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.life -= dt;
  });
  for (var bi = enemyBullets.length - 1; bi >= 0; bi--) {
    var b = enemyBullets[bi];
    if (b.life <= 0 || b.x < -30 || b.y < -30 || b.x > canvas.width + 30 || b.y > canvas.height + 30) {
      enemyBullets.splice(bi, 1);
      continue;
    }
    if (!player.inv && !player.dash) {
      var dxp = b.x - player.x, dyp = b.y - player.y;
      var hitR = Math.max(player.w, player.h) * 0.35 + b.r;
      if (dxp * dxp + dyp * dyp <= hitR * hitR) {
        var taken = b.dmg * (player.wushuang ? 0.5 : 1);
        player.hp -= taken; addFury(1.2);
        if (player.hp <= 0 && player.reviveCharges > 0) { player.reviveCharges--; player.hp = 1; player.inv=true; player.invT=2; showCinematic('紫金护符','保住一命','#d8b4ff',900); }
        addDamageText(player.x, player.y - 34, taken, '#ff8fa3', true);
        shake(7, 0.2);
        player.inv = true; player.invT = 0.45;
        enemyBullets.splice(bi, 1);
        spawnP(player.x, player.y, 8, '#ff6677');
      }
    }
  }

  // 碰撞
  monsters.forEach(function(m) {
    if (rectHit(player, m) && !player.inv && !player.dash && m.acd <= 0) {
      var contactDmg = (m.baseDmg + Math.floor(Math.random() * m.dmgR));
      var takenContact = contactDmg * (player.wushuang ? 0.5 : 1);
      player.hp -= takenContact; addFury(1.5);
      if (player.hp <= 0 && player.reviveCharges > 0) { player.reviveCharges--; player.hp = 1; player.inv=true; player.invT=2; showCinematic('紫金护符','保住一命','#d8b4ff',900); }
      addDamageText(player.x, player.y - 34, takenContact, '#ff8fa3', true);
      shake(m.boss ? 10 : 6, 0.22);
      player.inv = true; player.invT = 0.5; m.acd = 0.8;
    }
    if (m.acd > 0) m.acd -= dt;
    if (m.flash > 0) m.flash -= dt;
  });

  // 生成
  if (wave.spawned < wave.perWave && monsters.length < wave.maxField) {
    wave.spawnT += dt;
    if (wave.spawnT >= wave.interval) {
      wave.spawnT -= wave.interval;
      spawnMonster();
      wave.spawned++;
    }
  }

  // 死亡 & 升级
  for (var i = monsters.length-1; i >= 0; i--) {
    if (monsters[i].hp <= 0) {
      var dead = monsters[i];
      spawnP(dead.x, dead.y, dead.boss ? 28 : (dead.elite ? 16 : 8), dead.boss ? '#ff77a8' : (dead.elite ? '#ffd166' : '#ff4444'));
      if (dead.boss) { addRingEffect(dead.x, dead.y, '#ffe66d', 1.0, 30, 220, 12); shake(16, 0.65); }
      if (dead.elite) { addRingEffect(dead.x, dead.y, '#ffd166', 0.65, 18, 110, 7); spawnRelicDrop(dead.x,dead.y); addFury(15); }
      else if (!dead.boss) addFury(5);
      animeDeath(dead);
      monsters.splice(i, 1);
      player.kills++;
      player.combo++; player.comboT = 2.0;

      // 每击败3只升1级：怪物仍按V3.5规则进行30%概率血量成长，但玩家强化改为三选一构筑。
      if (!dead.boss && player.kills % 3 === 0) {
        player.level++;
        monsters.forEach(function(m) {
          if (m.boss) return;
          if (Math.random() < 0.30) {
            var originalMaxHp = m.baseMaxHp || m.maxHp;
            var hpIncrease = Math.round(originalMaxHp / 3);
            m.hpGrowthSteps = (m.hpGrowthSteps || 0) + 1;
            m.maxHp += hpIncrease;
            m.hp += hpIncrease;
          }
        });
        fx.lvUp = 0.2; fx.lvTxt = 1.0;
        showCinematic('LEVEL UP','大圣 Lv.' + player.level,'#ffe066',750); screenFlash('#ffe066',0.10,140);
        player.pendingUpgrades++;
        if (state===ST.PLAYING && player.pendingUpgrades>0) { player.pendingUpgrades--; prepareUpgradeChoices(); }
      }
    }
  }

  // 波次完成
  if (state === ST.PLAYING && monsters.length === 0 && wave.spawned >= wave.perWave && lootDrops.length === 0) {
    if (wave.cur >= wave.total) { state = ST.VICTORY; }
    else { state = ST.WAVE_CLEAR; wave.timer = 2.5; }
  }

  if (player.hp <= 0) { player.hp = 0; state = ST.GAMEOVER; }

  if (player.comboT > 0) { player.comboT -= dt; if (player.comboT <= 0) player.combo = 0; }
  if (fx.lvUp > 0) fx.lvUp -= dt;
  if (fx.lvTxt > 0) fx.lvTxt -= dt;
  if (fx.bossPhase > 0) fx.bossPhase -= dt;
  if (fx.shake > 0) { fx.shake -= dt; if (fx.shake <= 0) fx.shakePower = 0; }
  if (fx.landLight) { fx.landLight.t += dt; if (fx.landLight.t >= fx.landLight.dur) fx.landLight = null; }

  for (var j = particles.length-1; j >= 0; j--) {
    var p = particles[j];
    p.x += p.vx; p.y += p.vy; p.life -= dt;
    if (p.life <= 0) particles.splice(j, 1);
  }

  for (var ei = effects.length - 1; ei >= 0; ei--) {
    var ef = effects[ei];
    ef.life -= dt;
    if (ef.type === 'afterImage') ef.y -= dt * 6;
    if (ef.life <= 0) effects.splice(ei, 1);
  }

  for (var fi = floatTexts.length - 1; fi >= 0; fi--) {
    var ft = floatTexts[fi];
    ft.y -= dt * 34; ft.life -= dt;
    if (ft.life <= 0) floatTexts.splice(fi, 1);
  }
}

// === 绘制 ===

function getBackgroundIndexForWave(waveNo) {
  // 1-3 森林 / 4-7 天庭 / 8-10 岩浆
  if (waveNo <= 3) return 0;
  if (waveNo <= 7) return 1;
  return 2;
}

function drawBg() {
  var idx = getBackgroundIndexForWave(Math.max(1, wave.cur || 1));
  var fallbackColors = ['#18351e', '#394864', '#351511'];
  ctx.fillStyle=fallbackColors[idx]||'#1f3424'; ctx.fillRect(0,0,canvas.width,canvas.height);

  if (sceneTransition.active) {
    var progress=Math.min(1,(performance.now()-sceneTransition.start)/sceneTransition.dur);
    var eased=progress*progress*(3-2*progress);
    drawImageCover(BG.imgs[sceneTransition.from],1-eased,1.055);
    drawImageCover(BG.imgs[sceneTransition.to],eased,1.035);
    if (progress>=1) sceneTransition.active=false;
  } else {
    drawImageCover(BG.imgs[idx],1,1.035);
  }

  // 场景色调：降低背景与弹幕/角色争抢视觉注意力
  ctx.save();
  if (idx===0) ctx.fillStyle='rgba(9,34,16,.16)';
  else if (idx===1) ctx.fillStyle='rgba(92,130,180,.10)';
  else ctx.fillStyle='rgba(94,22,10,.16)';
  ctx.fillRect(0,0,canvas.width,canvas.height);
  var shade=ctx.createLinearGradient(0,0,0,canvas.height);
  shade.addColorStop(0,'rgba(0,0,0,.16)'); shade.addColorStop(.45,'rgba(0,0,0,0)'); shade.addColorStop(1,'rgba(0,0,0,.28)');
  ctx.fillStyle=shade; ctx.fillRect(0,0,canvas.width,canvas.height); ctx.restore();
  drawSceneAmbient(idx);
}

function drawSceneAmbient(idx) {
  var now=performance.now()/1000;
  var count=mobileMode ? 18 : 30;
  ctx.save();
  if (idx===0) {
    // 森林：萤火 + 飘叶
    for(var i=0;i<count;i++){
      var x=((i*97.3 + now*(6+(i%4)*2))%(canvas.width+80))-40;
      var y=((i*53.7 + Math.sin(now*.7+i)*36)%(canvas.height+40));
      var a=.18+.20*(.5+.5*Math.sin(now*2+i));
      ctx.globalAlpha=a; ctx.fillStyle=i%3===0?'#d9ff7a':'#ffe88a';
      ctx.beginPath();ctx.arc(x,y,1.5+(i%3)*.45,0,Math.PI*2);ctx.fill();
      if(i%5===0){ctx.translate(x,y);ctx.rotate(now*.4+i);ctx.fillStyle='#86b65a';ctx.fillRect(-5,-1,10,2);ctx.setTransform(1,0,0,1,0,0);}
    }
  } else if (idx===1) {
    // 天庭：云气丝带 + 光尘
    for(var h=0;h<8;h++){
      var yy=(h*91 + Math.sin(now*.18+h)*24)%(canvas.height+100)-30;
      var xx=((h*173 - now*(8+h%3))%(canvas.width+260))-130;
      ctx.globalAlpha=.055;ctx.fillStyle='#eff9ff';ctx.beginPath();ctx.ellipse(xx,yy,110+(h%3)*35,20+(h%2)*7,0,0,Math.PI*2);ctx.fill();
    }
    for(var j=0;j<count;j++){
      var sx=(j*113.7)%canvas.width, sy=(j*67.1+now*(5+j%3))%canvas.height;
      ctx.globalAlpha=.14+.16*(.5+.5*Math.sin(now*1.6+j));ctx.fillStyle='#eaffff';ctx.beginPath();ctx.arc(sx,sy,1+(j%3)*.45,0,Math.PI*2);ctx.fill();
    }
  } else {
    // 火焰山：由下往上的火星
    for(var k=0;k<count+10;k++){
      var ex=(k*83.9 + Math.sin(k*2.1+now)*28)%canvas.width;
      var ey=canvas.height-((k*61.3+now*(30+k%5*8))%(canvas.height+70));

  if (p.jump && p.jump.active) {

    } else if (imageReady(SPR.fallback)) {
      ctx.drawImage(SPR.fallback, dx, dy, dw, dh);
    } else {
      ctx.fillStyle = '#eebb22';
      ctx.fillRect(dx, dy, dw, dh);
      ctx.fillStyle = '#fff';

function drawSkillEffects() {
  effects.forEach(function(ef) {
    var alpha = Math.max(0, ef.life / ef.ml);
    ctx.save();
    ctx.globalAlpha = alpha;
    if (ef.type === 'pulse') {
      var p = 1 - alpha;
      var rr = ef.r0 + (ef.r1 - ef.r0) * p;
      var g = ctx.createRadialGradient(ef.x, ef.y, rr * 0.15, ef.x, ef.y, rr);
      g.addColorStop(0, ef.color);

      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(ef.x, ef.y, rr, 0, Math.PI * 2); ctx.fill();
    } else if (ef.type === 'ring') {
      var prog = 1 - alpha;

      ctx.strokeStyle = ef.color;
      ctx.lineWidth = ef.lw;
      ctx.shadowColor = ef.color; ctx.shadowBlur = 14;
      ctx.beginPath(); ctx.arc(ef.x, ef.y, r, 0, Math.PI*2); ctx.stroke();
    } else if (ef.type === 'slashFill') {
      var aa = DIR_ANGLES[ef.dir] || 0;
      var ss = aa - (ef.ang * Math.PI / 180) / 2;
      var ee = aa + (ef.ang * Math.PI / 180) / 2;
      var rr2 = ef.rad * (0.55 + (1 - alpha) * 0.3);
      var grad = ctx.createRadialGradient(ef.x, ef.y, rr2 * 0.18, ef.x, ef.y, rr2);
      grad.addColorStop(0, 'rgba(255,255,255,0.0)');
      grad.addColorStop(0.45, ef.color);
      grad.addColorStop(1, 'rgba(255,255,255,0)');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.moveTo(ef.x, ef.y);
      ctx.arc(ef.x, ef.y, rr2, ss, ee);
      ctx.closePath();
      ctx.fill();
    } else if (ef.type === 'slash') {
      var a = DIR_ANGLES[ef.dir] || 0;
      var start = a - (ef.ang * Math.PI / 180) / 2;
      var end = a + (ef.ang * Math.PI / 180) / 2;
      var r = ef.rad * (0.72 + (1 - alpha) * 0.28);

      ctx.lineWidth = 10;
      ctx.shadowColor = ef.color;
      ctx.shadowBlur = 18;

  ctx.textAlign='center';ctx.fillStyle='#ff6670';ctx.font='900 '+(mobileMode?42:62)+'px Arial,sans-serif';ctx.fillText('败 阵',canvas.width/2,canvas.height/2-78);
  var pw=mobileMode?280:390,ph=94,px=canvas.width/2-pw/2,py=canvas.height/2-40;roundedRectPath(px,py,pw,ph,16);ctx.fillStyle='rgba(8,8,12,.66)';ctx.fill();ctx.strokeStyle='rgba(255,102,112,.24)';ctx.stroke();
  ctx.fillStyle='#f5f5f5';ctx.font='700 '+(mobileMode?14:17)+'px Arial,sans-serif';ctx.fillText('击杀 '+player.kills+'    ·    Lv.'+player.level+'    ·    第 '+wave.cur+' 波',canvas.width/2,py+36);ctx.fillStyle='#c4c8cc';ctx.font='500 '+(mobileMode?12:14)+'px Arial,sans-serif';ctx.fillText('调整走位与技能时机，再战妖潮',canvas.width/2,py+65);

function drawBossPhaseAlert() {

  ctx.fillStyle = 'rgba(90,0,25,0.35)';

function drawPaused() {
  ctx.save();ctx.fillStyle='rgba(2,5,8,.62)';ctx.fillRect(0,0,canvas.width,canvas.height);
  var w=mobileMode?220:300,h=112,x=canvas.width/2-w/2,y=canvas.height/2-h/2;roundedRectPath(x,y,w,h,18);ctx.fillStyle='rgba(8,13,18,.82)';ctx.fill();ctx.strokeStyle='rgba(255,225,140,.24)';ctx.stroke();

// === 渲染 ===
function render() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  if (state === ST.START) { drawBg(); drawStart(); return; }

  var sx = 0, sy = 0;
  if (fx.shake > 0) {
    sx = (Math.random() * 2 - 1) * fx.shakePower;
    sy = (Math.random() * 2 - 1) * fx.shakePower;
  }

  ctx.save();
  ctx.translate(sx, sy);
  drawBg();
  drawAnimeGhosts();
  drawLootDrops();
  drawSummons();
  monsters.forEach(function(m) { drawMonster(m); });
  drawPlayerProjectiles();
  drawEnemyBullets();
  drawAnimeVfx();
  drawSkillEffects();
  drawPlayer();
  drawParticles();
  drawFloatTexts();
  drawLandLight();
  ctx.restore();
  drawBattlePostFx();

  drawLevelUp();
  if (state === ST.PLAYING || state === ST.PAUSED) { drawHUD(); if (!mobileMode) drawSkillBar(); drawBossHud(); }
  drawBossPhaseAlert();
  if (state === ST.WAVE_INTRO) drawWaveIntro();
  if (state === ST.WAVE_CLEAR) drawWaveClear();
  if (state === ST.VICTORY) drawVictory();
  if (state === ST.GAMEOVER) drawGameOver();
  if (state === ST.PAUSED) drawPaused();
  if (state === ST.SKILL_CHOICE || state === ST.SKILL_REPLACE) drawSkillChoice();
}

// 技能选择按钮布局(供绘制和点击检测共用)
function skillChoiceButtons() {
  var replaceMode = state === ST.SKILL_REPLACE;
  var count = replaceMode ? 4 : upgradeChoices.length;
  if (mobileMode) {
    var cols = canvas.width < canvas.height ? 1 : Math.min(replaceMode ? 4 : 3, count);
    var gap = 10;
    var bw = cols===1 ? Math.min(300,canvas.width-40) : Math.min(190,(canvas.width-34-gap*(cols-1))/cols);
    var bh = replaceMode ? 74 : 90;
    var rows = Math.ceil(count / cols);
    var sy = Math.max(110,(canvas.height-(rows*bh+(rows-1)*gap))/2+20);
    var out=[];
    for(var i=0;i<count;i++){
      var row=Math.floor(i/cols), col=i%cols, rowCount=Math.min(cols,count-row*cols);
      var rowW=rowCount*bw+(rowCount-1)*gap, rowSx=(canvas.width-rowW)/2;
      out.push({x:rowSx+col*(bw+gap),y:sy+row*(bh+gap),w:bw,h:bh,idx:i});
    }
    return out;
  }
  var bw=replaceMode?170:210,bh=replaceMode?82:112,gap=18;
  var total=count*bw+(count-1)*gap;
  if(total>canvas.width-40){bw=Math.max(150,(canvas.width-40-gap*(count-1))/count);total=count*bw+(count-1)*gap;}
  var sx=(canvas.width-total)/2,sy=canvas.height/2-bh/2+10;
  return Array.from({length:count},function(_,i){return{x:sx+i*(bw+gap),y:sy,w:bw,h:bh,idx:i};});
}

function chooseSkill(idx) {
  if (state !== ST.SKILL_CHOICE || idx<0 || idx>=upgradeChoices.length) return;
  var c=upgradeChoices[idx];
  if(c.kind==='new'){
    var empty=firstEmptySkillSlot();
    if(empty>0){equipNewSkill(c.id,empty);state=ST.PLAYING;}
    else {pendingReplacementSkill=c.id;state=ST.SKILL_REPLACE;}
  } else if(c.kind==='upgrade') {
    upgradeSkill(skills[c.slot]); state=ST.PLAYING;
  } else if(c.kind==='stat') {
    applyStatUpgrade(c.id); showCinematic(c.title,'强化完成',c.color,700); state=ST.PLAYING;
  }
  if(state===ST.PLAYING) { upgradeChoices=[]; if(player.pendingUpgrades>0){player.pendingUpgrades--;prepareUpgradeChoices();} }
}

function chooseReplacement(idx){
  if(state!==ST.SKILL_REPLACE || !pendingReplacementSkill) return;
  var slot=idx+1;if(slot<1||slot>4||!skills[slot]) return;
  var oldName=skills[slot].nm;var id=pendingReplacementSkill;pendingReplacementSkill=null;
  equipNewSkill(id,slot);upgradeChoices=[];state=ST.PLAYING;
  if(player.pendingUpgrades>0){player.pendingUpgrades--;prepareUpgradeChoices();}
  addEffect({type:'textPop',x:canvas.width/2,y:canvas.height/2-110,text:'替换 '+oldName,color:'#ffe066',life:0.8,ml:0.8});
}

function drawSkillChoice() {

  ctx.save();ctx.fillStyle='rgba(2,5,8,.84)';ctx.fillRect(0,0,canvas.width,canvas.height);

  ctx.fillText(replaceMode?'技能已满 · 选择替换':'升级 · 三选一',canvas.width/2,mobileMode?62:canvas.height/2-128);
  ctx.fillStyle='rgba(255,255,255,.68)';ctx.font='600 '+(mobileMode?12:14)+'px Arial,sans-serif';
  ctx.fillText(replaceMode?'新技能：'+(SKILL_TEMPLATES[pendingReplacementSkill]?SKILL_TEMPLATES[pendingReplacementSkill].nm:''):'获取新技能、强化已有技能或提升属性',canvas.width/2,mobileMode?88:canvas.height/2-95);
  var btns=skillChoiceButtons();
  btns.forEach(function(b){
    if(replaceMode){
      var sk=skills[b.idx+1];var c=sk?sk.color:'#999';roundedRectPath(b.x,b.y,b.w,b.h,14);ctx.fillStyle='rgba(8,12,18,.9)';ctx.fill();ctx.strokeStyle=c;ctx.lineWidth=2;ctx.stroke();
      ctx.fillStyle=c;ctx.font='900 17px Arial,sans-serif';ctx.fillText((b.idx+1)+'  '+(sk?sk.nm:'空槽'),b.x+b.w/2,b.y+29);
      ctx.fillStyle='#dfe5e9';ctx.font='600 12px Arial,sans-serif';ctx.fillText(sk?('Lv.'+sk.level+' · 点击替换'):'',b.x+b.w/2,b.y+55);
    } else {
      var ch=upgradeChoices[b.idx];if(!ch)return;var c2=ch.color||'#ffe066';roundedRectPath(b.x,b.y,b.w,b.h,16);ctx.fillStyle='rgba(7,12,18,.9)';ctx.fill();ctx.strokeStyle=c2;ctx.lineWidth=2;ctx.stroke();
      var kind=ch.kind==='new'?'新技能':ch.kind==='upgrade'?'技能强化':'属性强化';ctx.fillStyle=c2;ctx.font='800 11px Arial,sans-serif';ctx.fillText(kind,b.x+b.w/2,b.y+20);
      ctx.font='900 '+(mobileMode?16:19)+'px Arial,sans-serif';ctx.fillText((b.idx+1)+'  '+ch.title,b.x+b.w/2,b.y+45);
      ctx.fillStyle='#e4e9ed';ctx.font='600 '+(mobileMode?11:12)+'px Arial,sans-serif';
      var desc=ch.desc||'';if(desc.length>22){ctx.fillText(desc.slice(0,22),b.x+b.w/2,b.y+67);ctx.fillText(desc.slice(22,44),b.x+b.w/2,b.y+84);}else ctx.fillText(desc,b.x+b.w/2,b.y+74);
    }
  });
  ctx.fillStyle='rgba(255,255,255,.42)';ctx.font='500 12px Arial,sans-serif';ctx.fillText(mobileMode?'点击卡片确认':'鼠标点击 / 数字键选择',canvas.width/2,canvas.height-28);
  ctx.restore();ctx.textAlign='left';
}

// === 游戏循环 ===
var lastTime = 0;

function loop(ts) {
  requestAnimationFrame(loop);
  if (lastTime === 0) { lastTime = ts; render(); return; }
  var dt = (ts - lastTime) / 1000;
  lastTime = ts;
  if (dt > 0.1) dt = 0.1;

  if (state === ST.WAVE_INTRO || state === ST.WAVE_CLEAR) {
    wave.timer -= dt;
    if (wave.timer <= 0) {
      if (state === ST.WAVE_INTRO) state = ST.PLAYING;
      else if (state === ST.WAVE_CLEAR) nextWave();
    }
  }

  if (state === ST.PLAYING) {
    aiTimer += dt;
    if (aiTimer >= AI_INT) { aiTimer -= AI_INT; updateAI(); }
  }

  update(dt);
  if (animeEngine) animeEngine.update();
  render();
  updateMobileHud();
}

// === 手机端触控 ===
function setupMobileControls() {
  var root = document.getElementById('mobile-controls');
  var joy = document.getElementById('mobile-joystick');
  var stick = document.getElementById('mobile-stick');
  var pause = document.getElementById('mobile-pause');
  var wushuangBtn = document.getElementById('mobile-wushuang');
  var skillBtns = Array.prototype.slice.call(document.querySelectorAll('.mobile-skill'));
  mobileUI = { root:root, joy:joy, stick:stick, pause:pause, wushuang:wushuangBtn, skills:skillBtns };

  function refreshVisibility() {
    detectMobileMode();
    if (!root) return;
    root.classList.toggle('mobile-on', mobileMode);
    root.setAttribute('aria-hidden', mobileMode ? 'false' : 'true');
  }
  refreshVisibility();
  window.addEventListener('resize', refreshVisibility);
  window.addEventListener('orientationchange', function() { setTimeout(function(){ resize(); refreshVisibility(); }, 80); });

  function updateJoyFromEvent(e) {
    var rect = joy.getBoundingClientRect();
    var cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
    var dx = e.clientX - cx, dy = e.clientY - cy;
    var maxR = rect.width * 0.32;
    var len = Math.hypot(dx, dy) || 1;
    if (len > maxR) { dx = dx / len * maxR; dy = dy / len * maxR; }
    mobileJoy.x = dx / maxR; mobileJoy.y = dy / maxR;
    stick.style.transform = 'translate(' + dx.toFixed(1) + 'px,' + dy.toFixed(1) + 'px)';
    var dead = 0.24;
    keys.KeyA = mobileJoy.x < -dead;
    keys.KeyD = mobileJoy.x > dead;
    keys.KeyW = mobileJoy.y < -dead;
    keys.KeyS = mobileJoy.y > dead;
  }
  joy.addEventListener('pointerdown', function(e) {
    e.preventDefault(); startFromMobileIfNeeded();
    mobileJoy.pointerId = e.pointerId;
    try { joy.setPointerCapture(e.pointerId); } catch (_) {}
    updateJoyFromEvent(e);
  });
  joy.addEventListener('pointermove', function(e) {
    if (mobileJoy.pointerId !== e.pointerId) return;
    e.preventDefault(); updateJoyFromEvent(e);
  });
  function endJoy(e) {
    if (mobileJoy.pointerId !== null && e.pointerId !== undefined && mobileJoy.pointerId !== e.pointerId) return;
    mobileJoy.pointerId = null; clearMobileMovement();
  }
  joy.addEventListener('pointerup', endJoy);
  joy.addEventListener('pointercancel', endJoy);
  joy.addEventListener('lostpointercapture', endJoy);

  skillBtns.forEach(function(btn) {
    btn.addEventListener('pointerdown', function(e) {
      e.preventDefault(); e.stopPropagation();
      startFromMobileIfNeeded();
      if (state !== ST.PLAYING) return;
      var idx = parseInt(btn.getAttribute('data-skill'), 10);
      var sk = skills[idx];
      if (!sk || sk.t < sk.cd || player.dash) return;
      justPressed[sk.key] = true;
    });
  });

  pause.addEventListener('pointerdown', function(e) {
    e.preventDefault(); e.stopPropagation();
    if (state === ST.PLAYING) { state = ST.PAUSED; clearMobileMovement(); }
    else if (state === ST.PAUSED) { state = ST.PLAYING; lastTime = performance.now(); }
  });
}

function updateMobileHud() {
  if (!mobileUI) return;
  var active = mobileMode && state === ST.PLAYING;
  mobileUI.joy.style.visibility = active ? 'visible' : 'hidden';
  document.getElementById('mobile-skills').style.visibility = active ? 'visible' : 'hidden';
  mobileUI.pause.style.visibility = (mobileMode && (state === ST.PLAYING || state === ST.PAUSED)) ? 'visible' : 'hidden';
  mobileUI.pause.textContent = state === ST.PAUSED ? '▶' : 'Ⅱ';
  mobileUI.skills.forEach(function(btn, i) {
    var sk = skills && skills[i];
    var span=btn.querySelector('span'),small=btn.querySelector('small');
    if (!sk) { btn.classList.remove('ready');btn.classList.add('cooldown');if(span)span.textContent='空';if(small)small.textContent=i===0?'SPACE':ACTIVE_KEYS[i-1].label;return; }
    var ready = sk.t >= sk.cd;
    btn.style.setProperty('--skill', sk.color || '#ffe066');
    btn.classList.toggle('ready', ready); btn.classList.toggle('cooldown', !ready);
    if(span) span.textContent=sk.icon||'技';
    if(small) small.textContent = ready ? (i===0?'普攻':sk.nm) : Math.max(0, sk.cd - sk.t).toFixed(1) + 's';
  });
  if(mobileUI.wushuang){var readyWu=player&&player.fury>=player.maxFury&&!player.wushuang;mobileUI.wushuang.classList.toggle('ready',readyWu||player.wushuang);var sm=mobileUI.wushuang.querySelector('small');if(sm)sm.textContent=player.wushuang?player.wushuangT.toFixed(1)+'s':Math.floor(player.fury)+'%';}
}

setupMobileControls();
updateMobileHud();

// === 输入 ===
window.addEventListener('keydown', function(e) {
  var cc = e.code;
  if (['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','KeyW','KeyA','KeyS','KeyD','KeyQ','KeyE','KeyR','KeyF','KeyX','ShiftLeft','ShiftRight','KeyP'].indexOf(cc) >= 0)
    e.preventDefault();

  if (state === ST.START) {
    if (cc !== 'F5' && cc !== 'F12') { init(); nextWave(); }
    return;
  }
  if (cc === 'KeyP') {
    if (state === ST.PLAYING) state = ST.PAUSED;
    else if (state === ST.PAUSED) { state = ST.PLAYING; lastTime = performance.now(); }
    return;
  }
  if (cc === 'KeyR' && (state === ST.GAMEOVER || state === ST.VICTORY)) {
    init(); nextWave(); lastTime = performance.now();
    return;
  }
  // 升级三选一 / 满技能后的替换选择
  if (state === ST.SKILL_CHOICE) { var m = cc.match(/^Digit([1-3])$/); if (m) chooseSkill(parseInt(m[1]) - 1); return; }
  if (state === ST.SKILL_REPLACE) { var mr = cc.match(/^Digit([1-4])$/); if (mr) chooseReplacement(parseInt(mr[1]) - 1); return; }
  if (state !== ST.PLAYING && state !== ST.PAUSED) return;
  if (!keys[cc]) justPressed[cc] = true;
  keys[cc] = true;
});

window.addEventListener('keyup', function(e) { keys[e.code] = false; });

// 技能选择：鼠标点击按钮
canvas.addEventListener('click', function(e) {
  if (state !== ST.SKILL_CHOICE && state !== ST.SKILL_REPLACE) return;
  var rect = canvas.getBoundingClientRect();
  var mx = (e.clientX - rect.left) * (canvas.width / rect.width);
  var my = (e.clientY - rect.top) * (canvas.height / rect.height);
  var btns = skillChoiceButtons();
  for (var i = 0; i < btns.length; i++) {
    var b = btns[i];
    if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) {
      if(state===ST.SKILL_REPLACE) chooseReplacement(b.idx); else chooseSkill(b.idx);
      return;
    }
  }
});

canvas.addEventListener('touchstart', function(e) {
  e.preventDefault();
  if (!e.touches || !e.touches.length) return;
  if (state === ST.START) { init(); nextWave(); lastTime = performance.now(); return; }
  if (state === ST.GAMEOVER || state === ST.VICTORY) { init(); nextWave(); lastTime = performance.now(); return; }
  if (state === ST.SKILL_CHOICE || state === ST.SKILL_REPLACE) {
    var rect = canvas.getBoundingClientRect();
    var t = e.touches[0];
    var mx = (t.clientX - rect.left) * (canvas.width / rect.width);
    var my = (t.clientY - rect.top) * (canvas.height / rect.height);
    var btns = skillChoiceButtons();
    for (var i = 0; i < btns.length; i++) {
      var b = btns[i];
      if (mx >= b.x && mx <= b.x + b.w && my >= b.y && my <= b.y + b.h) { if(state===ST.SKILL_REPLACE) chooseReplacement(b.idx); else chooseSkill(b.idx); break; }
    }
  }
}, { passive: false });

window.__animeVfxStatus = function(){ return { available:animeAvailable, activeVfx:animeVfx.length, ghosts:animeGhosts.length, version:'4.5.0', source:'cdn+canvas-fallback' }; };

window.__gameDebug = {
  mobileStatus: function() { return { mobileMode:mobileMode, width:canvas.width, height:canvas.height, portrait:canvas.height > canvas.width, joystick:{x:mobileJoy.x,y:mobileJoy.y} }; },
  progressionStatus: function() { return { version:'V4.1', level:player.level, fury:player.fury, wushuang:player.wushuang, skills:skills.map(function(s,i){return s?{slot:i,name:s.nm,level:s.level,damage:s.bdmg,cd:s.cd}:null;}), relics:player.relics, monsters:monsters.filter(function(m){return !m.boss;}).map(function(m){return {model:m.model, elite:m.elite, hp:m.hp, maxHp:m.maxHp};}) }; },
  assetStatus: function() { return { walkLoaded:SPR.loaded, walkTotal:SPR.total, fallback:imageReady(SPR.fallback), attackLoaded:ATK.loaded, bgLoaded:BG.loaded, bgFlags:BG.loadedFlags.slice(), bgForWave:getBackgroundIndexForWave(wave.cur || 1) }; },
  start: function() { init(); nextWave(); lastTime = performance.now(); },
  setWave: function(n) { init(); wave.cur = Math.max(0, n - 1); nextWave(); state = ST.PLAYING; lastTime = performance.now(); },
  castSkill: function(index) { var sk=skills[index]; if (!sk) return false; sk.t=sk.cd; useSkill(sk); return true; },
  grantSkill: function(id) { return equipNewSkill(id); },
  levelUp: function() { player.level++; prepareUpgradeChoices(); return upgradeChoices; },
  fullFury: function(){ player.fury=player.maxFury; return player.fury; },
  wushuang: function(){ player.fury=player.maxFury; return activateWushuang(); },
  eliteDropPreview: function(){ init();state=ST.PLAYING;wave.cur=5;var m=makeMonster(canvas.width*.65,canvas.height*.5,player.level);m.elite=true;m.eliteType='armored';m.hp=m.maxHp=1;monsters.push(m);return '击杀该精英即可测试法宝掉落'; },
  killFirstMonster: function(){ if(!monsters.length)return false;monsters[0].hp=0;update(0.016);return true; },
  buildPreview: function(){ init();state=ST.PLAYING;equipNewSkill('clone',3);equipNewSkill('staffWave',4);player.fury=100;for(var i=0;i<8;i++)monsters.push(makeMonster(160+(i%4)*220,180+Math.floor(i/4)*260,player.level));wave.spawned=wave.perWave=8;return 'V4.1 build preview ready'; },
  bossPreview: function() { init(); wave.cur = 9; nextWave(); state = ST.PLAYING; player.hp = player.maxHp; spawnMonster(); wave.spawned = 1; lastTime = performance.now(); },
  bossPhase2: function() { init(); wave.cur = 9; nextWave(); state = ST.PLAYING; spawnMonster(); wave.spawned = 1; monsters[0].hp = monsters[0].maxHp * 0.48; lastTime = performance.now(); },
  tick: function(dt, count) { dt = dt || 0.016; count = count || 1; for (var i=0;i<count;i++) { aiTimer += dt; if (aiTimer >= AI_INT) { aiTimer -= AI_INT; updateAI(); } update(dt); } },
  heal: function() { player.hp = player.maxHp; },
  snapshot: function() { var boss = monsters.find(function(m){return m.boss;}); return { state:state,wave:wave.cur,bossPhase:boss?boss.phase:0,monsters:monsters.length,elites:monsters.filter(function(m){return m.elite;}).length,bullets:enemyBullets.length,hp:player.hp,level:player.level,fury:player.fury,wushuang:player.wushuang,summons:summons.length,projectiles:playerProjectiles.length,drops:lootDrops.length }; }
};

// === 启动 ===
requestAnimationFrame(loop);

})();
